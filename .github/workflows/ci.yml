# FishSmart Pro CI Pipeline
# Runs the full test suite on every push to prod and all pull requests.
# Blocks merge if any test fails.

name: CI

on:
  push:
    branches: [prod, main]
  pull_request:
    branches: [prod, main]

jobs:
  test:
    name: Test Suite (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Version sync check
        run: npm run version:check

      - name: Run test suite
        run: npm test
        env:
          CI: true
