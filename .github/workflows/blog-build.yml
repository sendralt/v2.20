# FishSmart Pro — Blog Auto-Build
# Automatically converts growth-engine markdown posts to styled HTML
# whenever new blog content is pushed to the pipeline.

name: Blog Build

on:
  push:
    paths:
      - 'docs/growth/pipeline/blog/**/*.md'
      - 'landing-page/blog/build_blog.py'
      - 'landing-page/blog/blog.css'
    branches: [prod, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-blog:
    name: Build Blog HTML from Markdown
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install markdown

      - name: Build blog pages
        run: python landing-page/blog/build_blog.py

      - name: Check for changes
        id: changes
        run: |
          git add landing-page/blog/posts/ landing-page/blog/index.html
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit built blog pages
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m " Auto-build blog pages from markdown pipeline

          Generated by blog-build workflow from updated markdown sources.

          Co-Authored-By: FishSmart Pro Growth Engine"
          git push

      - name: Summary
        run: |
          echo "### Blog Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Built posts:" >> $GITHUB_STEP_SUMMARY
          ls -1 landing-page/blog/posts/*.html 2>/dev/null | xargs -I{} basename {} >> $GITHUB_STEP_SUMMARY || echo "(none)" >> $GITHUB_STEP_SUMMARY
